[project]
name = "sign-language-translator-backend"
version = "0.1.0"
description = "FastAPI backend for Real-Time Sign Language & Facial Grammar Translation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mediapipe==0.10.14",
    "opencv-python>=4.10.0.84",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0,<2.0.0",
    "python-multipart>=0.0.9",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.1",
    "joblib>=1.4.0",
    "requests>=2.31.0",
]

[tool.uv]
package = false
